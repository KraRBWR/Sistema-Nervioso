<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: lámina anatómica (escenario SVG a la izquierda, ficha de datos a la derecha), pestañas por escala: cuerpo, encéfalo, neurona, sinapsis, reflejo */
:root{
  --bg:#e8ebed; --panel:#f5f6f7; --ink:#182027; --ink2:#47535d; --line:#a9b3ba; --accent:#a3301d;
  --stage:#d8dee2; --grid:#c4ccd2; --sel:#a3301d; --hover:#1d6f99;
  --skin1:#d2c2b1; --skin2:#a38f7b; --bone:#e3dccb; --bone-line:#b6ab94;
  --nerve:#a67f12; --nerve-hi:#d6aa2a; --cord:#ebe5d2;
  --motor:#d2561a; --sens:#1b75a3;
  --musc1:#b9564c; --musc2:#7b302d;
  --lf:#cf8f88; --lp:#d0a95e; --lt:#86ae8f; --lo:#7f93b8; --lc:#b5754e; --lb:#a38a98;
  --neu:#bf9467; --nuc:#7d4a56; --myelin:#f0e6c4;
  --fire:#f08a2c; --fire2:#f6c453;
  --f-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1216; --panel:#171d23; --ink:#e8ecef; --ink2:#a3aeb7; --line:#37424b; --accent:#ee7e63;
  --stage:#0c1014; --grid:#182027; --sel:#ff9a52; --hover:#6cc4ec;
  --skin1:#4b413b; --skin2:#2b2523; --bone:#6e665b; --bone-line:#4c463e;
  --nerve:#e7d9a0; --nerve-hi:#fff2c0; --cord:#ddd7c2;
  --motor:#ff8f45; --sens:#5cc0ea;
  --musc1:#a5453e; --musc2:#5f2523;
  --neu:#a97d52; --nuc:#8c5662; --myelin:#e9dfbd;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1216; --panel:#171d23; --ink:#e8ecef; --ink2:#a3aeb7; --line:#37424b; --accent:#ee7e63;
  --stage:#0c1014; --grid:#182027; --sel:#ff9a52; --hover:#6cc4ec;
  --skin1:#4b413b; --skin2:#2b2523; --bone:#6e665b; --bone-line:#4c463e;
  --nerve:#e7d9a0; --nerve-hi:#fff2c0; --cord:#ddd7c2;
  --motor:#ff8f45; --sens:#5cc0ea;
  --musc1:#a5453e; --musc2:#5f2523;
  --neu:#a97d52; --nuc:#8c5662; --myelin:#e9dfbd;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-ui);
  padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:0;padding:6px 11px;cursor:pointer}
button:hover,select:hover{border-color:var(--ink)}
button:focus-visible,select:focus-visible,a:focus-visible,.hs:focus-visible{outline:2px solid var(--hover);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
h1{margin:0;font:700 27px/1 var(--f-head);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.wm{font:500 11px/1 var(--f-mono);letter-spacing:.08em;color:var(--ink2);text-decoration:none;border:1px solid var(--line);padding:5px 7px;text-transform:none}
.wm:hover{color:var(--ink);border-color:var(--ink)}
.lang{display:flex;align-items:center;gap:8px;font:500 12px var(--f-mono);color:var(--ink2)}
.tabs{display:flex;overflow-x:auto;border-bottom:2px solid var(--ink);scrollbar-width:thin}
.tab{border:0;border-right:1px solid var(--line);background:transparent;font:600 14px var(--f-head);letter-spacing:.05em;text-transform:uppercase;padding:10px 16px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;align-items:start}
.stage{position:relative;height:clamp(460px,calc(100vh - 150px),860px);border:1px solid var(--line);overflow:hidden;
  background-color:var(--stage);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:40px 40px;background-position:-1px -1px}
#views{position:absolute;inset:0}
.view{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s}
.view.on{opacity:1;visibility:visible}
.view svg{width:100%;height:100%;display:block;touch-action:manipulation}
.legend[hidden]{display:none}
.zoomed .lab,.zoomed .bl{display:none}
.legend{position:absolute;left:10px;top:10px;z-index:3;display:flex;flex-direction:column;gap:4px;font:500 11px var(--f-mono);color:var(--ink2);background:color-mix(in srgb,var(--stage) 82%,transparent);padding:6px 8px;border:1px solid var(--line);max-width:230px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:-1px}
.tools{position:absolute;left:10px;bottom:10px;z-index:3;display:flex;flex-wrap:wrap;gap:6px}
.tools button{font:500 12px var(--f-mono);padding:6px 9px}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tip{position:absolute;z-index:4;pointer-events:none;background:var(--ink);color:var(--bg);font:500 12px var(--f-mono);padding:4px 8px;white-space:nowrap}
.panel{border:1px solid var(--line);background:var(--panel);padding:18px 18px 16px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
.panel .kick{font:500 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.panel h2{margin:6px 0 10px;font:700 30px/1.05 var(--f-head);letter-spacing:.01em;padding-bottom:10px;border-bottom:3px double var(--ink)}
.panel p{margin:0 0 12px}
.panel ul{margin:0 0 14px;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.panel li{padding-left:18px;position:relative}
.panel li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:1px;background:var(--ink)}
.curio{border:1px dashed var(--ink2);padding:10px 12px;margin:0 0 14px;font-size:14px}
.curio b{display:block;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;color:var(--ink2)}
.pnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.prog{display:flex;flex-wrap:wrap;gap:3px;margin:14px 0 4px}
.prog span{width:12px;height:12px;border:1px solid var(--ink2)}
.prog span.v{background:var(--ink)}
.prog span.c{outline:2px solid var(--sel);outline-offset:1px}
.pcap{font:500 11px var(--f-mono);color:var(--ink2)}
.steps{display:flex;flex-direction:column;gap:0;margin:0 0 12px;padding:0;list-style:none;border:1px solid var(--line)}
.steps button{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);padding:8px 10px;display:flex;gap:10px;background:transparent}
.steps li:last-child button{border-bottom:0}
.steps button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.steps .sn{font:500 12px var(--f-mono);min-width:18px}
.intro p{color:var(--ink2)}
.quiz{border:1px solid var(--line);background:var(--panel);padding:24px;max-width:820px;margin:0 auto;width:100%}
.quiz h2{margin:0 0 6px;font:700 28px/1.1 var(--f-head)}
.qbar{display:flex;gap:4px;margin:12px 0 22px}
.qbar span{flex:1;height:6px;background:var(--line)}
.qbar span.ok{background:#2f8a4f}.qbar span.no{background:#b8362a}.qbar span.cur{background:var(--ink)}
.qopts{display:flex;flex-direction:column;gap:8px;margin:16px 0}
.qopts button{text-align:left;padding:11px 14px;font-size:15px}
.qopts button.ok{border-color:#2f8a4f;background:color-mix(in srgb,#2f8a4f 20%,var(--panel));border-width:2px}
.qopts button.no{border-color:#b8362a;background:color-mix(in srgb,#b8362a 18%,var(--panel));border-width:2px}
.qexp{border:1px dashed var(--ink2);padding:10px 12px;margin-bottom:14px}
.qscore{font:700 54px/1 var(--f-head);margin:8px 0}
@keyframes dash{to{stroke-dashoffset:-20}}
.hs{cursor:pointer;outline:none}
.hs .hit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;stroke-linecap:round}
.hs .hitf{fill:transparent;pointer-events:all}
.hs .nv{fill:none;stroke:var(--nerve);stroke-linecap:round;stroke-linejoin:round;pointer-events:none;transition:stroke .2s}
.hs:hover .nv,.hs:focus-visible .nv{stroke:var(--nerve-hi)}
.hs.sel .nv{stroke:var(--sel)}
.hs .sh{transition:stroke .2s,stroke-width .2s}
.hs:hover .sh,.hs:focus-visible .sh{stroke:var(--hover);stroke-width:2}
.hs.sel .sh{stroke:var(--sel);stroke-width:2.6;stroke-dasharray:7 4;animation:dash 1s linear infinite}
.hs.sel .nv.ring{stroke-width:7;opacity:.25}
.lab text{font:500 12.5px var(--f-mono);fill:var(--ink);cursor:pointer}
.lab line,.lab polyline{stroke:var(--ink2);stroke-width:.7;fill:none}
.lab circle{fill:var(--ink)}
.lab.sel text{fill:var(--sel);font-weight:500}
.lab.sel line,.lab.sel polyline{stroke:var(--sel);stroke-width:1.2}
.lab.sel circle{fill:var(--sel)}
.lab:hover text{fill:var(--hover)}
.svgtxt{font:500 13px var(--f-mono);fill:var(--ink2)}
@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .stage{height:clamp(420px,66vh,640px)}
  .panel{position:static;max-height:none}
  h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--skin1)"/><stop offset="1" style="stop-color:var(--skin2)"/></linearGradient>
    <linearGradient id="gMusc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--musc1)"/><stop offset="1" style="stop-color:var(--musc2)"/></linearGradient>
    <linearGradient id="gCord" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--cord);stop-opacity:.55"/><stop offset=".5" style="stop-color:var(--cord)"/><stop offset="1" style="stop-color:var(--cord);stop-opacity:.55"/></linearGradient>
    <linearGradient id="gMyel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--myelin);stop-opacity:.7"/><stop offset=".38" style="stop-color:var(--myelin)"/><stop offset="1" style="stop-color:var(--myelin);stop-opacity:.55"/></linearGradient>
    <radialGradient id="gSoma" cx=".38" cy=".35" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".45" style="stop-color:var(--neu)"/><stop offset="1" style="stop-color:var(--neu);stop-opacity:.8"/></radialGradient>
    <radialGradient id="gNuc" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".6" style="stop-color:var(--nuc)"/><stop offset="1" style="stop-color:var(--nuc)"/></radialGradient>
    <radialGradient id="gFlame" cx=".5" cy=".7" r=".6"><stop offset="0" stop-color="#fff6c8"/><stop offset=".45" stop-color="#f6b83a"/><stop offset="1" stop-color="#e2531a"/></radialGradient>
    <filter id="tissue" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4" result="n"/>

      <feSpecularLighting in="b" surfaceScale="5" specularConstant=".75" specularExponent="22" lighting-color="#fff" result="s"><feDistantLight azimuth="235" elevation="52"/></feSpecularLighting>
      <feComposite in="s" in2="d" operator="in" result="sp"/>

<script>
'use strict';
const I18N={};
I18N.es={
ui:{
 ttl:'Sistema nervioso', lang:'Idioma',
 tabs:{body:'Cuerpo',brain:'Encéfalo',neuron:'Neurona',syn:'Sinapsis',reflex:'Reflejo',quiz:'Desafío'},
 motor:'Orden: del cerebro al músculo', sens:'Información: del cuerpo al cerebro',
 reset:'Vista completa', labels:'Etiquetas', signals:'Señales', fire:'Disparar impulso', play:'Reproducir', stop:'Detener',
 kindSel:'Elegido', fun:'¿Sabías que…?', explored:'Explorados', prev:'Anterior', next:'Siguiente', toBrain:'Ver el encéfalo por dentro', toNeuron:'Ver la neurona', toSyn:'Ver la sinapsis', toBody:'Volver al cuerpo',
 introT:'Toca una parte',
 intro:{
  body:'Toca cualquier nervio, órgano o ganglio del cuerpo para ver su función. Los puntos de colores son impulsos nerviosos: los naranjas llevan órdenes y los azules traen información.',
  brain:'Toca cada región del encéfalo para ver qué controla. Mira cómo se pliega la corteza para entrar en el cráneo.',
  neuron:'Toca cada parte de la neurona. Con el botón puedes ver cómo viaja un impulso desde las dendritas hasta los botones terminales.',
  syn:'Aquí se comunican dos neuronas. Toca cada estructura y usa el botón para ver cómo pasa el mensaje químico.',
  reflex:'Un reflejo es una respuesta rápida que no espera al cerebro. Reproduce la animación o toca cada paso.'},
 step:'Paso', qOf:'Pregunta', score:'Puntaje', again:'Repetir', ok:'¡Correcto!', no:'Incorrecto.', done:'Terminaste', nextQ:'Siguiente pregunta', finish:'Ver resultado',
 rank:['Sigue explorando: vuelve a las láminas y prueba otra vez.','Buen trabajo, ya dominas lo básico.','Excelente, conoces muy bien el sistema nervioso.'],
 quizT:'Desafío', quizSub:'7 preguntas para comprobar lo que aprendiste.'
},
items:{
 encefalo:{n:'Encéfalo',k:'SNC · Órgano',d:'Es el centro de control del cuerpo. Recibe información de los sentidos, la interpreta y ordena respuestas. Está formado por el cerebro, el cerebelo y el tronco encefálico.',f:['Pesa cerca de 1,4 kg y tiene unos 86 000 millones de neuronas.','Lo protegen el cráneo, tres capas llamadas meninges y el líquido cefalorraquídeo.','Usa cerca del 20 % de la energía del cuerpo, aunque pesa solo el 2 %.'],c:'La superficie del cerebro está plegada: si se estirara, ocuparía unos 2 000 cm², como una pizarra chica.'},
 ojos:{n:'Ojo y nervio óptico',k:'Receptor · Par craneal II',d:'Los fotorreceptores de la retina (conos y bastones) convierten la luz en impulsos nerviosos. El nervio óptico los lleva hasta el encéfalo.',f:['Los conos detectan el color y los bastones funcionan con poca luz.','La imagen se interpreta en el lóbulo occipital, en la parte de atrás de la cabeza.','Donde el nervio sale del ojo no hay fotorreceptores: es el punto ciego.'],c:'La imagen llega invertida a la retina y el cerebro la "da vuelta" sin que lo notes.'},
 craneales:{n:'Nervios craneales',k:'SNP · 12 pares',d:'Son nervios que salen directamente del encéfalo, sin pasar por la médula. Controlan la cabeza y el cuello y algunos llegan más lejos.',f:['Hay 12 pares, numerados con números romanos (I al XII).','Algunos son sensitivos (olfato, vista), otros motores (mover los ojos) y otros mixtos.','El nervio facial mueve los músculos de la cara y el vestibulococlear lleva la audición y el equilibrio.'],c:'Para recordarlos, muchos estudiantes usan frases en las que cada palabra empieza como un nervio.'},
 vago:{n:'Nervio vago',k:'SNP · Par craneal X · Mixto',d:'Es el nervio más largo de los craneales. Baja desde el tronco encefálico por el cuello hasta el tórax y el abdomen, y comunica al cerebro con los órganos internos.',f:['Baja la frecuencia del corazón y activa la digestión.','Forma parte del sistema parasimpático, el que nos calma.','"Vago" viene de "vagabundo": recorre mucho camino.'],c:'Respirar lento y profundo estimula el nervio vago y ayuda a relajarse.'},
 medula:{n:'Médula espinal',k:'SNC · Cordón nervioso',d:'Es un cordón de unos 45 cm que baja por dentro de la columna vertebral. Lleva mensajes entre el encéfalo y el cuerpo y es el centro de los reflejos.',f:['Por dentro tiene sustancia gris (cuerpos de neuronas) con forma de mariposa; por fuera, sustancia blanca (axones).','Termina a la altura de las primeras vértebras lumbares; después sigue la "cola de caballo".','Las vértebras y las meninges la protegen.'],c:'Una lesión en la médula puede cortar la comunicación con las piernas o los brazos según su altura.'},
 raquideos:{n:'Nervios raquídeos',k:'SNP · 31 pares · Mixtos',d:'Salen de la médula entre las vértebras. Cada uno se forma al unirse una raíz sensitiva (dorsal) con una raíz motora (ventral).',f:['Son 31 pares: 8 cervicales, 12 torácicos, 5 lumbares, 5 sacros y 1 coccígeo.','Por la raíz dorsal entra la información sensitiva; por la ventral salen las órdenes motoras.','Son mixtos: llevan los dos tipos de mensajes.'],c:'Los nervios cervicales controlan hasta el diafragma, el músculo principal de la respiración.'},
 ganglios:{n:'Ganglios raquídeos',k:'SNP · Ganglio sensitivo',d:'Son pequeños abultamientos en la raíz dorsal de cada nervio raquídeo. Allí están los cuerpos de las neuronas sensitivas.',f:['Un ganglio es un grupo de cuerpos neuronales ubicado fuera del sistema nervioso central.','La información sensitiva pasa por ellos camino a la médula.','Cada ganglio atiende una zona de la piel y de los órganos.'],c:'Una infección con el virus de la varicela puede quedar escondida en estos ganglios durante años.'},
 simpatica:{n:'Cadena simpática',k:'SNP · Sistema autónomo',d:'Son dos cadenas de ganglios a los lados de la columna. Forman el sistema simpático, que prepara al cuerpo para actuar rápido ("lucha o huida").',f:['Acelera el corazón y la respiración.','Dilata las pupilas y frena la digestión.','Actúa sin que lo decidas: es parte del sistema nervioso autónomo.'],c:'Cuando te asustas y "se te acelera el corazón", la cadena simpática está trabajando.'},
 intercostales:{n:'Nervios intercostales',k:'SNP · Torácicos',d:'Pasan entre las costillas. Mueven los músculos que ayudan a respirar y dan sensibilidad al tórax y al abdomen.',f:['Salen de los nervios raquídeos torácicos.','Controlan los músculos intercostales que suben y bajan las costillas.','Llevan el tacto y el dolor de la pared del tórax.'],c:'El hipo ocurre por espasmos del diafragma, que controla otro nervio: el frénico.'},
 braquial:{n:'Plexo braquial',k:'SNP · Red de nervios',d:'Es una red donde se mezclan las raíces de los nervios raquídeos cervicales y de la primera torácica. De ahí nacen los nervios del brazo.',f:['Se forma con 5 raíces (C5 a T1).','Pasa por el hombro, entre el cuello y la axila.','Una lesión grave puede paralizar el brazo.'],c:'Un tirón fuerte del hombro en un accidente puede dañar el plexo braquial.'},
 radial:{n:'Nervio radial',k:'SNP · Mixto',d:'Recorre el lado externo del brazo hasta el dorso de la mano. Extiende el codo, la muñeca y los dedos.',f:['Mueve el tríceps, el músculo de atrás del brazo.','Da sensibilidad al dorso de la mano y al lado del pulgar.','Dormir con el brazo colgando de una silla puede comprimirlo y adormecer la mano.'],c:'Si se daña, la muñeca queda caída y cuesta levantar la mano.'},
 mediano:{n:'Nervio mediano',k:'SNP · Mixto',d:'Baja por el centro del antebrazo y pasa por la muñeca hacia la palma. Flexiona los dedos y permite agarrar con precisión.',f:['Da sensibilidad a la palma, al pulgar y a los dedos índice y medio.','Pasa por el túnel del carpo, un espacio estrecho de la muñeca.','Si se comprime, aparece hormigueo: síndrome del túnel carpiano.'],c:'Usar mucho el teclado o el celular sin descanso puede irritarlo.'},
 cubital:{n:'Nervio cubital',k:'SNP · Mixto',d:'Recorre el lado interno del brazo, pasa por detrás del codo y llega a los dedos meñique y anular. Mueve los músculos pequeños de la mano.',f:['Da sensibilidad al meñique y a la mitad del anular.','En el codo está muy superficial y casi sin protección.','Permite abrir y cerrar los dedos con fuerza.'],c:'El golpe en el "hueso de la risa" del codo en realidad golpea este nervio.'},
 lumbosacro:{n:'Plexo lumbosacro',k:'SNP · Red de nervios',d:'Es una red de nervios en la zona de la cintura y la pelvis. De él salen los nervios de las piernas.',f:['Se forma con raíces de las vértebras lumbares y sacras.','Mueve la cadera, el muslo y la pierna.','Da sensibilidad a la parte inferior del cuerpo.'],c:'Es la red nerviosa más grande del cuerpo.'},
 femoral:{n:'Nervio femoral',k:'SNP · Mixto',d:'Baja por la parte delantera del muslo. Estira la rodilla y da sensibilidad a la cara delantera e interna de la pierna.',f:['Mueve el cuádriceps, el músculo más grande del muslo.','Su rama final, el nervio safeno, llega hasta el tobillo.','Interviene en el reflejo rotuliano.'],c:'En el reflejo rotuliano, un golpecito en la rodilla hace saltar la pierna sin que lo decidas.'},
 ciatico:{n:'Nervio ciático',k:'SNP · Mixto',d:'Es el nervio más largo y grueso del cuerpo. Va desde la pelvis por detrás del muslo y se divide en dos ramas sobre la rodilla: el tibial y el peroneo.',f:['Su grosor llega a ser como el de un dedo.','Controla los músculos de atrás del muslo, de la pierna y del pie.','La ciática es el dolor que aparece cuando se comprime.'],c:'Mide más de un metro, casi la longitud de la pierna.'},
 piel:{n:'Receptores de la piel',k:'Receptores sensitivos',d:'Son terminaciones nerviosas que detectan el tacto, la presión, la temperatura y el dolor. Convierten el estímulo en un impulso nervioso.',f:['Las yemas de los dedos tienen muchísimos, por eso son tan sensibles.','Los receptores del dolor (nociceptores) nos avisan de un peligro.','La información viaja por neuronas sensitivas hasta la médula y el encéfalo.'],c:'Algunas zonas de la piel, como la espalda, tienen mucho menos receptores que los labios.'},
 musculo:{n:'Músculo (efector)',k:'Efector',d:'Los músculos son efectores: reciben las órdenes de las neuronas motoras y responden contrayéndose.',f:['La neurona motora se conecta con la fibra muscular en la placa motora.','El neurotransmisor acetilcolina da la orden de contraer.','Los músculos esqueléticos se mueven por voluntad, salvo en los reflejos.'],c:'Una sola neurona motora puede controlar desde unas pocas fibras hasta miles.'},
 frontal:{n:'Lóbulo frontal',k:'SNC · Cerebro',d:'Es la parte de adelante y la más grande del cerebro. Planifica, toma decisiones, controla el movimiento voluntario y el lenguaje hablado.',f:['La corteza motora, al final del lóbulo, ordena los movimientos.','Interviene en la personalidad, la atención y el autocontrol.','Termina de madurar recién cerca de los 25 años.'],c:'Es la región que más cambia durante la adolescencia.'},
 parietal:{n:'Lóbulo parietal',k:'SNC · Cerebro',d:'Recibe e interpreta las sensaciones del cuerpo: tacto, presión, temperatura y dolor. También ayuda a orientarse en el espacio.',f:['La corteza sensitiva está justo detrás de la corteza motora.','Cada parte del cuerpo tiene su zona; manos y labios ocupan mucho espacio.','Permite saber dónde está tu mano aunque no la mires.'],c:'Gracias al lóbulo parietal puedes escribir en el teclado sin mirar.'},
 temporal:{n:'Lóbulo temporal',k:'SNC · Cerebro',d:'Se ubica a los costados, cerca de las orejas. Procesa los sonidos, ayuda a comprender el lenguaje y participa en la memoria.',f:['La corteza auditiva interpreta lo que oímos.','Contiene el hipocampo, clave para formar recuerdos nuevos.','También interviene en el olfato y en las emociones.'],c:'Una canción puede devolverte un recuerdo entero gracias a esta zona.'},
 occipital:{n:'Lóbulo occipital',k:'SNC · Cerebro',d:'Está en la parte de atrás de la cabeza. Es el centro de la visión: recibe lo que captan los ojos y arma la imagen.',f:['Recibe los impulsos del nervio óptico.','Reconoce formas, colores y movimiento.','Si se daña, puede perderse la vista aunque los ojos estén sanos.'],c:'Un golpe fuerte en la nuca a veces hace "ver estrellas".'},
 cerebelo:{n:'Cerebelo',k:'SNC · Encéfalo',d:'Está debajo del cerebro, atrás. Coordina los movimientos, mantiene el equilibrio y hace que los gestos sean precisos y suaves.',f:['Su nombre significa "cerebro pequeño".','Tiene más de la mitad de las neuronas de todo el encéfalo.','Aprende movimientos automáticos, como andar en bicicleta.'],c:'Con el cerebelo dañado, tocarse la nariz con el dedo se vuelve difícil.'},
 tronco:{n:'Tronco encefálico',k:'SNC · Encéfalo',d:'Une el cerebro con la médula espinal. Está formado por el mesencéfalo, la protuberancia y el bulbo raquídeo.',f:['Controla funciones vitales: respiración, latidos y presión.','Regula actos como tragar, toser y vomitar.','Por él pasan casi todos los nervios que suben y bajan.'],c:'No decides respirar mientras duermes: lo hace el bulbo por ti.'},
 dendritas:{n:'Dendritas',k:'Neurona · Recepción',d:'Son prolongaciones cortas y muy ramificadas. Reciben los mensajes de otras neuronas y los llevan hacia el cuerpo celular.',f:['Su forma de árbol aumenta la superficie para recibir señales.','Una neurona puede recibir miles de contactos.','El nombre viene del griego "dendron", árbol.'],c:'Aprender cosas nuevas crea más ramificaciones y conexiones.'},
 soma:{n:'Cuerpo celular (soma)',k:'Neurona · Integración',d:'Es la parte central de la neurona. Contiene el núcleo y los orgánulos que fabrican lo que la célula necesita, y suma las señales que llegan.',f:['Decide si se genera un impulso nervioso.','Contiene mitocondrias que dan energía.','Mide entre 4 y 100 micrómetros.'],c:'Los cuerpos celulares forman la sustancia gris.'},
 nucleo:{n:'Núcleo',k:'Neurona · Control',d:'Guarda el ADN y dirige las actividades de la célula. Allí está la información para fabricar las proteínas que la neurona necesita.',f:['Tiene una zona oscura llamada nucléolo.','La mayoría de las neuronas casi no se dividen.','Por eso cuidar el cerebro es tan importante.'],c:'Cada neurona de tu cuerpo tiene el mismo ADN, pero usa genes distintos.'},
 axon:{n:'Axón',k:'Neurona · Conducción',d:'Es una prolongación larga y fina que conduce el impulso eléctrico desde el cuerpo celular hasta otras células.',f:['Cada neurona tiene un solo axón, que se ramifica al final.','Puede medir más de un metro, como en las que van de la médula al pie.','El impulso viaja en una sola dirección.'],c:'Algunos axones de la jirafa miden varios metros.'},
 mielina:{n:'Vaina de mielina',k:'Neurona · Aislante',d:'Es una cubierta de grasa y proteínas que envuelve al axón por tramos. Aísla el axón y hace que el impulso viaje mucho más rápido.',f:['La forman las células de Schwann en los nervios.','El impulso puede alcanzar 120 m/s, unos 430 km/h.','En la esclerosis múltiple se daña la mielina.'],c:'La mielina es blanquecina: por eso la "sustancia blanca" tiene ese color.'},
 ranvier:{n:'Nodos de Ranvier',k:'Neurona · Conducción',d:'Son los pequeños espacios sin mielina entre un tramo y otro. En ellos se regenera el impulso, que "salta" de nodo en nodo.',f:['Este salto se llama conducción saltatoria.','Hace la transmisión más rápida y gasta menos energía.','Los separan unos 1 a 2 mm en axones grandes.'],c:'Reciben el nombre del médico francés Louis Ranvier, que los describió.'},
 terminales:{n:'Botones terminales',k:'Neurona · Transmisión',d:'Son los extremos del axón. Allí el impulso eléctrico se convierte en una señal química que se libera hacia otra célula.',f:['Contienen vesículas con neurotransmisores.','Pueden conectar con otra neurona, un músculo o una glándula.','Cada neurona puede tener cientos de terminales.'],c:'El contacto entre un botón terminal y otra célula se llama sinapsis.'},
 presin:{n:'Terminal presináptico',k:'Sinapsis · Neurona emisora',d:'Es el extremo del axón de la neurona que envía el mensaje. Cuando llega el impulso, libera neurotransmisores.',f:['Contiene mitocondrias que aportan energía.','El impulso abre canales y entra calcio (Ca²⁺).','El calcio hace que las vesículas se fusionen con la membrana.'],c:'Si no hay calcio, la sinapsis no funciona.'},
 vesiculas:{n:'Vesículas sinápticas',k:'Sinapsis · Almacén',d:'Son bolsitas diminutas llenas de neurotransmisores. Esperan cerca de la membrana hasta que llega el impulso.',f:['Se fusionan con la membrana y vacían su contenido.','Ese proceso se llama exocitosis.','Después la célula recicla sus membranas.'],c:'Una terminal puede tener cientos de vesículas listas.'},
 neurotrans:{n:'Neurotransmisores',k:'Sinapsis · Mensajeros',d:'Son sustancias químicas que llevan el mensaje de una neurona a la siguiente. Cada tipo produce efectos distintos.',f:['Ejemplos: acetilcolina, dopamina, serotonina y GABA.','Se eliminan enseguida: se recapturan o se destruyen.','Algunos medicamentos y drogas actúan sobre ellos.'],c:'La dopamina se relaciona con la motivación y el placer.'},
 hendidura:{n:'Hendidura sináptica',k:'Sinapsis · Espacio',d:'Es el espacio diminuto entre dos neuronas. El impulso eléctrico no puede cruzarlo, así que pasa como señal química.',f:['Mide unos 20 a 40 nanómetros.','Un nanómetro es la millonésima parte de un milímetro.','Los neurotransmisores lo cruzan en milésimas de segundo.'],c:'Es mucho más estrecha que un cabello: unas 2 000 veces.'},
 receptores:{n:'Receptores',k:'Sinapsis · Recepción',d:'Son proteínas en la membrana de la neurona receptora. Cada una encaja con un neurotransmisor, como una llave en una cerradura.',f:['Al unirse, abren canales para que entren iones.','Solo responden al neurotransmisor que les corresponde.','Su número cambia con el uso.'],c:'La cafeína bloquea receptores y por eso quita el sueño.'},
 postsin:{n:'Neurona postsináptica',k:'Sinapsis · Neurona receptora',d:'Recibe el mensaje. Si la señal es suficiente, se genera un nuevo impulso nervioso y el mensaje sigue su camino.',f:['La sinapsis puede excitar o inhibir a la neurona.','La neurona suma todas las señales que recibe.','Así se transmite la información por las redes de neuronas.'],c:'Aprender fortalece las sinapsis que más usas.'},
 estimulo:{n:'Estímulo',k:'Paso 1',d:'Algo del ambiente cambia: por ejemplo, tocas un objeto muy caliente.',f:[],c:'Un estímulo puede ser calor, frío, presión, luz o sonido.'},
 receptor:{n:'Receptor',k:'Paso 2',d:'Los receptores de dolor de la piel detectan el peligro y transforman el estímulo en un impulso nervioso.',f:[],c:'Están a lo largo de toda la piel.'},
 sensitiva:{n:'Neurona sensitiva',k:'Paso 3 · Vía aferente',d:'Lleva el impulso desde el receptor hasta la médula espinal. Entra por la raíz dorsal, pasando por el ganglio raquídeo.',f:[],c:'"Aferente" significa que lleva hacia el centro.'},
 interneurona:{n:'Médula e interneurona',k:'Paso 4 · Centro integrador',d:'En la sustancia gris de la médula, la interneurona conecta la neurona sensitiva con la motora. La respuesta se decide acá, sin esperar al cerebro.',f:[],c:'Por eso el reflejo es tan rápido.'},
 motora:{n:'Neurona motora',k:'Paso 5 · Vía eferente',d:'Lleva la orden desde la médula hasta el músculo. Sale por la raíz ventral del nervio raquídeo.',f:[],c:'"Eferente" significa que lleva hacia afuera.'},
 efector:{n:'Efector',k:'Paso 6 · Respuesta',d:'El músculo se contrae y retiras la mano del peligro, todo en una fracción de segundo.',f:[],c:'Un reflejo es involuntario: ocurre sin que lo decidas.'},
 cerebro:{n:'Cerebro',k:'Paso 7 · Después',d:'Mientras tanto, otra señal sube por la médula hasta el cerebro. Recién ahí sientes el dolor y te das cuenta de lo que pasó.',f:[],c:'Primero te proteges y después lo notas.'}
},
quiz:[
 {q:'¿Cuál es la unidad básica del sistema nervioso?',o:['La nefrona','La neurona','El alvéolo','La fibra muscular'],a:1,e:'La neurona es la célula especializada en recibir y transmitir impulsos nerviosos.'},
 {q:'¿Qué parte del encéfalo coordina el equilibrio y los movimientos?',o:['El cerebelo','El lóbulo occipital','El bulbo raquídeo','El hipotálamo'],a:0,e:'El cerebelo ajusta los movimientos y mantiene el equilibrio.'},
 {q:'¿Qué estructura recubre al axón y acelera el impulso?',o:['El núcleo','Las dendritas','La vaina de mielina','Los ganglios'],a:2,e:'La mielina aísla el axón y permite que el impulso salte entre los nodos de Ranvier.'},
 {q:'¿Cómo pasa el mensaje de una neurona a otra en la sinapsis?',o:['Con neurotransmisores','Con un cable eléctrico','Con la sangre','Con el aire'],a:0,e:'El impulso eléctrico se convierte en una señal química: los neurotransmisores cruzan la hendidura.'},
 {q:'¿Qué neurona lleva información desde el receptor hacia la médula?',o:['Motora','Interneurona','Sensitiva (aferente)','Glial'],a:2,e:'La neurona sensitiva o aferente lleva la información hacia el sistema nervioso central.'},
 {q:'¿Cuántos pares de nervios craneales existen?',o:['8','12','31','24'],a:1,e:'Son 12 pares que salen directamente del encéfalo.'},
 {q:'¿Cuál es el nervio más largo y grueso del cuerpo?',o:['El ciático','El cubital','El mediano','El vago'],a:0,e:'El nervio ciático recorre la pierna desde la pelvis hasta el pie.'}
]};

items:{
 encefalo:{n:'Brain (encephalon)',k:'CNS · Organ',d:'It is the control center of the body. It receives information from the senses, interprets it and orders responses. It includes the cerebrum, the cerebellum and the brainstem.',f:['It weighs about 1.4 kg and has around 86 billion neurons.','The skull, three layers called meninges and cerebrospinal fluid protect it.','It uses about 20% of the body\'s energy while weighing only 2%.'],c:'The surface of the cerebrum is folded: stretched out, it would cover about 2,000 cm².'},
 ojos:{n:'Eye and optic nerve',k:'Receptor · Cranial nerve II',d:'Photoreceptors in the retina (cones and rods) turn light into nerve impulses. The optic nerve carries them to the brain.',f:['Cones detect color and rods work in dim light.','The image is interpreted in the occipital lobe, at the back of the head.','Where the nerve leaves the eye there are no photoreceptors: the blind spot.'],c:'The image reaches the retina upside down and the brain flips it without you noticing.'},
 craneales:{n:'Cranial nerves',k:'PNS · 12 pairs',d:'These nerves leave directly from the brain, without passing through the spinal cord. They control the head and neck, and some reach further.',f:['There are 12 pairs, numbered with Roman numerals (I to XII).','Some are sensory (smell, sight), some motor (moving the eyes) and some mixed.','The facial nerve moves the face muscles and the vestibulocochlear nerve carries hearing and balance.'],c:'Many students memorize them with phrases where each word starts like a nerve.'},
 vago:{n:'Vagus nerve',k:'PNS · Cranial nerve X · Mixed',d:'It is the longest cranial nerve. It runs from the brainstem down the neck into the chest and abdomen, linking the brain to the internal organs.',f:['It slows the heart rate and activates digestion.','It is part of the parasympathetic system, the one that calms us.','"Vagus" means "wandering": it covers a lot of ground.'],c:'Slow, deep breathing stimulates the vagus nerve and helps you relax.'},
 medula:{n:'Spinal cord',k:'CNS · Nerve cord',d:'A cord about 45 cm long inside the vertebral column. It carries messages between the brain and the body and is the center of reflexes.',f:['Inside it has gray matter (neuron cell bodies) shaped like a butterfly; outside, white matter (axons).','It ends near the first lumbar vertebrae; below that comes the "cauda equina" (horse\'s tail).','The vertebrae and the meninges protect it.'],c:'Damage to the spinal cord can cut communication with legs or arms depending on its level.'},
 raquideos:{n:'Spinal nerves',k:'PNS · 31 pairs · Mixed',d:'They leave the spinal cord between the vertebrae. Each forms when a sensory (dorsal) root joins a motor (ventral) root.',f:['There are 31 pairs: 8 cervical, 12 thoracic, 5 lumbar, 5 sacral and 1 coccygeal.','Sensory information enters through the dorsal root; motor commands leave through the ventral one.','They are mixed: they carry both kinds of messages.'],c:'Cervical nerves even control the diaphragm, the main breathing muscle.'},
 ganglios:{n:'Dorsal root ganglia',k:'PNS · Sensory ganglion',d:'Small swellings on the dorsal root of each spinal nerve. The cell bodies of the sensory neurons are there.',f:['A ganglion is a group of neuron cell bodies located outside the central nervous system.','Sensory information passes through them on its way to the spinal cord.','Each ganglion serves an area of skin and organs.'],c:'The chickenpox virus can hide in these ganglia for years.'},
 simpatica:{n:'Sympathetic chain',k:'PNS · Autonomic system',d:'Two chains of ganglia beside the spine. They form the sympathetic system, which prepares the body to act fast ("fight or flight").',f:['It speeds up the heart and breathing.','It dilates the pupils and slows digestion.','It works without you deciding: it is part of the autonomic nervous system.'],c:'When you get scared and your heart races, the sympathetic chain is at work.'},
 intercostales:{n:'Intercostal nerves',k:'PNS · Thoracic',d:'They run between the ribs. They move muscles that help breathing and give sensation to the chest and abdomen.',f:['They come from the thoracic spinal nerves.','They control the intercostal muscles that raise and lower the ribs.','They carry touch and pain from the chest wall.'],c:'Hiccups are spasms of the diaphragm, which is controlled by another nerve: the phrenic nerve.'},
 braquial:{n:'Brachial plexus',k:'PNS · Nerve network',d:'A network where the roots of the cervical spinal nerves and the first thoracic one mix. The arm nerves are born from it.',f:['It is formed by 5 roots (C5 to T1).','It passes through the shoulder, between the neck and the armpit.','A serious injury can paralyze the arm.'],c:'A hard pull on the shoulder in an accident can damage the brachial plexus.'},
 radial:{n:'Radial nerve',k:'PNS · Mixed',d:'It runs along the outer side of the arm to the back of the hand. It extends the elbow, wrist and fingers.',f:['It moves the triceps, the muscle at the back of the arm.','It gives sensation to the back of the hand and the thumb side.','Sleeping with your arm hanging over a chair can compress it and numb the hand.'],c:'If it is damaged, the wrist drops and lifting the hand is hard.'},
 mediano:{n:'Median nerve',k:'PNS · Mixed',d:'It runs down the middle of the forearm and passes through the wrist into the palm. It bends the fingers and allows precise grip.',f:['It gives sensation to the palm, thumb, index and middle fingers.','It passes through the carpal tunnel, a narrow space in the wrist.','If compressed, it causes tingling: carpal tunnel syndrome.'],c:'Using a keyboard or phone for long periods without rest can irritate it.'},
 cubital:{n:'Ulnar nerve',k:'PNS · Mixed',d:'It runs along the inner side of the arm, passes behind the elbow and reaches the little and ring fingers. It moves the small muscles of the hand.',f:['It gives sensation to the little finger and half of the ring finger.','At the elbow it is very superficial and barely protected.','It lets you open and close the fingers with strength.'],c:'Hitting your "funny bone" actually hits this nerve.'},
 lumbosacro:{n:'Lumbosacral plexus',k:'PNS · Nerve network',d:'A network of nerves around the waist and pelvis. The nerves of the legs come out of it.',f:['It is formed by roots from the lumbar and sacral vertebrae.','It moves the hip, thigh and leg.','It gives sensation to the lower body.'],c:'It is the largest nerve network in the body.'},
 femoral:{n:'Femoral nerve',k:'PNS · Mixed',d:'It runs down the front of the thigh. It straightens the knee and gives sensation to the front and inner side of the leg.',f:['It moves the quadriceps, the biggest muscle of the thigh.','Its final branch, the saphenous nerve, reaches the ankle.','It takes part in the knee-jerk reflex.','' ].filter(Boolean),c:'In the knee-jerk reflex, a tap on the knee makes your leg kick without you deciding.'},
 ciatico:{n:'Sciatic nerve',k:'PNS · Mixed',d:'The longest and thickest nerve in the body. It runs from the pelvis down the back of the thigh and splits into two branches above the knee: the tibial and the peroneal.',f:['It can be as thick as a finger.','It controls the muscles at the back of the thigh, the leg and the foot.','Sciatica is the pain that appears when it is compressed.'],c:'It is over a meter long, almost the length of the leg.'},
 piel:{n:'Skin receptors',k:'Sensory receptors',d:'Nerve endings that detect touch, pressure, temperature and pain. They turn the stimulus into a nerve impulse.',f:['Fingertips have a huge number of them, which is why they are so sensitive.','Pain receptors (nociceptors) warn us of danger.','The information travels along sensory neurons to the spinal cord and brain.'],c:'Some skin areas, like the back, have far fewer receptors than the lips.'},
 musculo:{n:'Muscle (effector)',k:'Effector',d:'Muscles are effectors: they receive commands from motor neurons and respond by contracting.',f:['The motor neuron connects with the muscle fiber at the motor end plate.','The neurotransmitter acetylcholine gives the order to contract.','Skeletal muscles move at will, except during reflexes.'],c:'A single motor neuron can control from a few fibers to thousands.'},
 frontal:{n:'Frontal lobe',k:'CNS · Cerebrum',d:'The front and biggest part of the cerebrum. It plans, makes decisions, controls voluntary movement and spoken language.',f:['The motor cortex, at the back of the lobe, orders movements.','It takes part in personality, attention and self-control.','It only finishes maturing around age 25.'],c:'It is the region that changes the most during adolescence.'},
 parietal:{n:'Parietal lobe',k:'CNS · Cerebrum',d:'It receives and interprets body sensations: touch, pressure, temperature and pain. It also helps with orientation in space.',f:['The sensory cortex is right behind the motor cortex.','Each body part has its area; hands and lips take up a lot of space.','It lets you know where your hand is without looking.'],c:'Thanks to the parietal lobe you can type without looking at the keyboard.'},
 temporal:{n:'Temporal lobe',k:'CNS · Cerebrum',d:'Located at the sides, near the ears. It processes sounds, helps understand language and takes part in memory.',f:['The auditory cortex interprets what we hear.','It contains the hippocampus, key for forming new memories.','It also takes part in smell and emotions.'],c:'A song can bring back a whole memory thanks to this area.'},
 occipital:{n:'Occipital lobe',k:'CNS · Cerebrum',d:'At the back of the head. It is the vision center: it receives what the eyes capture and builds the image.',f:['It receives the impulses from the optic nerve.','It recognizes shapes, colors and movement.','If damaged, sight can be lost even with healthy eyes.'],c:'A hard blow to the back of the head sometimes makes you "see stars".'},
 cerebelo:{n:'Cerebellum',k:'CNS · Brain',d:'Below the cerebrum, at the back. It coordinates movements, keeps balance and makes gestures precise and smooth.',f:['Its name means "little brain".','It has more than half of all the neurons in the brain.','It learns automatic movements, like riding a bike.'],c:'With a damaged cerebellum, touching your nose with a finger becomes difficult.'},
 tronco:{n:'Brainstem',k:'CNS · Brain',d:'It joins the cerebrum to the spinal cord. It is formed by the midbrain, the pons and the medulla oblongata.',f:['It controls vital functions: breathing, heartbeat and blood pressure.','It regulates acts like swallowing, coughing and vomiting.','Almost all nerve pathways going up and down pass through it.'],c:'You do not decide to breathe while sleeping: the medulla does it for you.'},
 dendritas:{n:'Dendrites',k:'Neuron · Reception',d:'Short, highly branched extensions. They receive messages from other neurons and carry them to the cell body.',f:['Their tree shape increases the surface for receiving signals.','A neuron can receive thousands of contacts.','The name comes from the Greek "dendron", tree.'],c:'Learning new things creates more branches and connections.'},
 soma:{n:'Cell body (soma)',k:'Neuron · Integration',d:'The central part of the neuron. It holds the nucleus and the organelles that make what the cell needs, and it adds up the incoming signals.',f:['It decides whether a nerve impulse is generated.','It contains mitochondria that provide energy.','It measures between 4 and 100 micrometers.'],c:'The cell bodies make up the gray matter.'},
 nucleo:{n:'Nucleus',k:'Neuron · Control',d:'It stores the DNA and directs the cell\'s activities. It holds the information to make the proteins the neuron needs.',f:['It has a dark area called the nucleolus.','Most neurons almost never divide.','That is why taking care of the brain is so important.'],c:'Every neuron in your body has the same DNA, but uses different genes.'},
 axon:{n:'Axon',k:'Neuron · Conduction',d:'A long, thin extension that conducts the electrical impulse from the cell body to other cells.',f:['Each neuron has a single axon, which branches at the end.','It can be over a meter long, as in those from the spinal cord to the foot.','The impulse travels in one direction only.'],c:'Some axons in a giraffe are several meters long.'},
 mielina:{n:'Myelin sheath',k:'Neuron · Insulation',d:'A cover of fat and proteins that wraps the axon in sections. It insulates the axon and makes the impulse travel much faster.',f:['Schwann cells form it in the nerves.','The impulse can reach 120 m/s, about 430 km/h.','In multiple sclerosis the myelin is damaged.'],c:'Myelin is whitish: that is why "white matter" has that color.'},
 ranvier:{n:'Nodes of Ranvier',k:'Neuron · Conduction',d:'The small gaps without myelin between one section and the next. The impulse is renewed there and "jumps" from node to node.',f:['This jump is called saltatory conduction.','It makes transmission faster and uses less energy.','They are about 1 to 2 mm apart in large axons.'],c:'They are named after the French physician Louis Ranvier, who described them.'},
 terminales:{n:'Terminal buttons',k:'Neuron · Transmission',d:'The ends of the axon. There the electrical impulse turns into a chemical signal released toward another cell.',f:['They contain vesicles with neurotransmitters.','They can connect with another neuron, a muscle or a gland.','Each neuron can have hundreds of terminals.'],c:'The contact between a terminal button and another cell is called a synapse.'},
 presin:{n:'Presynaptic terminal',k:'Synapse · Sending neuron',d:'The end of the axon of the neuron that sends the message. When the impulse arrives, it releases neurotransmitters.',f:['It contains mitochondria that provide energy.','The impulse opens channels and calcium (Ca²⁺) enters.','Calcium makes the vesicles fuse with the membrane.'],c:'Without calcium, the synapse does not work.'},
 vesiculas:{n:'Synaptic vesicles',k:'Synapse · Storage',d:'Tiny sacs full of neurotransmitters. They wait near the membrane until the impulse arrives.',f:['They fuse with the membrane and empty their contents.','This process is called exocytosis.','Afterwards the cell recycles their membranes.'],c:'One terminal can have hundreds of vesicles ready.'},
 neurotrans:{n:'Neurotransmitters',k:'Synapse · Messengers',d:'Chemical substances that carry the message from one neuron to the next. Each type has different effects.',f:['Examples: acetylcholine, dopamine, serotonin and GABA.','They are removed quickly: recaptured or broken down.','Some medicines and drugs act on them.'],c:'Dopamine is related to motivation and pleasure.'},
 hendidura:{n:'Synaptic cleft',k:'Synapse · Gap',d:'The tiny gap between two neurons. The electrical impulse cannot cross it, so it passes on as a chemical signal.',f:['It measures about 20 to 40 nanometers.','A nanometer is a millionth of a millimeter.','Neurotransmitters cross it in thousandths of a second.'],c:'It is about 2,000 times narrower than a hair.'},
 receptores:{n:'Receptors',k:'Synapse · Reception',d:'Proteins in the membrane of the receiving neuron. Each one fits a neurotransmitter, like a key in a lock.',f:['When bound, they open channels so ions can enter.','They only respond to their matching neurotransmitter.','Their number changes with use.'],c:'Caffeine blocks receptors, which is why it keeps you awake.'},
 postsin:{n:'Postsynaptic neuron',k:'Synapse · Receiving neuron',d:'It receives the message. If the signal is strong enough, a new nerve impulse is generated and the message goes on.',f:['A synapse can excite or inhibit the neuron.','The neuron adds up all the signals it receives.','This is how information travels through neuron networks.'],c:'Learning strengthens the synapses you use most.'},
 estimulo:{n:'Stimulus',k:'Step 1',d:'Something in the environment changes: for example, you touch a very hot object.',f:[],c:'A stimulus can be heat, cold, pressure, light or sound.'},
 receptor:{n:'Receptor',k:'Step 2',d:'Pain receptors in the skin detect the danger and turn the stimulus into a nerve impulse.',f:[],c:'They are spread all over the skin.'},
 sensitiva:{n:'Sensory neuron',k:'Step 3 · Afferent pathway',d:'It carries the impulse from the receptor to the spinal cord. It enters through the dorsal root, passing the dorsal root ganglion.',f:[],c:'"Afferent" means carrying toward the center.'},
 interneurona:{n:'Spinal cord and interneuron',k:'Step 4 · Integrating center',d:'In the gray matter of the spinal cord, the interneuron connects the sensory neuron to the motor one. The response is decided here, without waiting for the brain.',f:[],c:'That is why a reflex is so fast.'},
 motora:{n:'Motor neuron',k:'Step 5 · Efferent pathway',d:'It carries the command from the spinal cord to the muscle. It leaves through the ventral root of the spinal nerve.',f:[],c:'"Efferent" means carrying outward.'},
 efector:{n:'Effector',k:'Step 6 · Response',d:'The muscle contracts and you pull your hand away from danger, all in a fraction of a second.',f:[],c:'A reflex is involuntary: it happens without you deciding.'},
 cerebro:{n:'Brain',k:'Step 7 · Afterwards',d:'Meanwhile, another signal climbs the spinal cord to the brain. Only then do you feel the pain and realize what happened.',f:[],c:'First you protect yourself, then you notice.'}
},
quiz:[
 {q:'What is the basic unit of the nervous system?',o:['The nephron','The neuron','The alveolus','The muscle fiber'],a:1,e:'The neuron is the cell specialized in receiving and transmitting nerve impulses.'},
 {q:'Which part of the brain coordinates balance and movements?',o:['The cerebellum','The occipital lobe','The medulla oblongata','The hypothalamus'],a:0,e:'The cerebellum fine-tunes movements and keeps balance.'},
 {q:'Which structure covers the axon and speeds up the impulse?',o:['The nucleus','The dendrites','The myelin sheath','The ganglia'],a:2,e:'Myelin insulates the axon and lets the impulse jump between the nodes of Ranvier.'},
 {q:'How does the message pass from one neuron to another at the synapse?',o:['With neurotransmitters','With an electric wire','With the blood','With the air'],a:0,e:'The electrical impulse becomes a chemical signal: neurotransmitters cross the cleft.'},
 {q:'Which neuron carries information from the receptor to the spinal cord?',o:['Motor','Interneuron','Sensory (afferent)','Glial'],a:2,e:'The sensory or afferent neuron carries information toward the central nervous system.'},
 {q:'How many pairs of cranial nerves are there?',o:['8','12','31','24'],a:1,e:'There are 12 pairs, leaving directly from the brain.'},
 {q:'Which is the longest and thickest nerve in the body?',o:['The sciatic nerve','The ulnar nerve','The median nerve','The vagus nerve'],a:0,e:'The sciatic nerve runs through the leg from the pelvis to the foot.'}
]};

items:{
 encefalo:{n:'Encéfalo',k:'SNC · Órgão',d:'É o centro de controle do corpo. Recebe informações dos sentidos, interpreta e ordena respostas. É formado pelo cérebro, o cerebelo e o tronco encefálico.',f:['Pesa cerca de 1,4 kg e tem uns 86 bilhões de neurônios.','Protegem-no o crânio, três camadas chamadas meninges e o líquido cefalorraquidiano.','Usa cerca de 20 % da energia do corpo, embora pese só 2 %.'],c:'A superfície do cérebro é dobrada: esticada, ocuparia uns 2 000 cm².'},
 ojos:{n:'Olho e nervo óptico',k:'Receptor · Nervo craniano II',d:'Os fotorreceptores da retina (cones e bastonetes) transformam a luz em impulsos nervosos. O nervo óptico os leva ao encéfalo.',f:['Os cones detectam a cor e os bastonetes funcionam com pouca luz.','A imagem é interpretada no lobo occipital, atrás da cabeça.','Onde o nervo sai do olho não há fotorreceptores: é o ponto cego.'],c:'A imagem chega invertida à retina e o cérebro a "vira" sem você notar.'},
 craneales:{n:'Nervos cranianos',k:'SNP · 12 pares',d:'São nervos que saem diretamente do encéfalo, sem passar pela medula. Controlam a cabeça e o pescoço e alguns vão mais longe.',f:['São 12 pares, numerados com algarismos romanos (I a XII).','Alguns são sensitivos (olfato, visão), outros motores (mover os olhos) e outros mistos.','O nervo facial move os músculos do rosto e o vestibulococlear leva a audição e o equilíbrio.'],c:'Muitos estudantes os memorizam com frases em que cada palavra começa como um nervo.'},
 vago:{n:'Nervo vago',k:'SNP · Nervo craniano X · Misto',d:'É o nervo craniano mais longo. Desce do tronco encefálico pelo pescoço até o tórax e o abdome, ligando o cérebro aos órgãos internos.',f:['Diminui a frequência do coração e ativa a digestão.','Faz parte do sistema parassimpático, o que nos acalma.','"Vago" vem de "vagabundo": percorre muito caminho.'],c:'Respirar devagar e fundo estimula o nervo vago e ajuda a relaxar.'},
 medula:{n:'Medula espinal',k:'SNC · Cordão nervoso',d:'É um cordão de uns 45 cm que desce dentro da coluna vertebral. Leva mensagens entre o encéfalo e o corpo e é o centro dos reflexos.',f:['Por dentro tem substância cinzenta (corpos de neurônios) em forma de borboleta; por fora, substância branca (axônios).','Termina na altura das primeiras vértebras lombares; depois segue a "cauda equina".','As vértebras e as meninges a protegem.'],c:'Uma lesão na medula pode cortar a comunicação com pernas ou braços, conforme a altura.'},
 raquideos:{n:'Nervos espinais',k:'SNP · 31 pares · Mistos',d:'Saem da medula entre as vértebras. Cada um se forma quando uma raiz sensitiva (dorsal) se une a uma raiz motora (ventral).',f:['São 31 pares: 8 cervicais, 12 torácicos, 5 lombares, 5 sacrais e 1 coccígeo.','Pela raiz dorsal entra a informação sensitiva; pela ventral saem as ordens motoras.','São mistos: levam os dois tipos de mensagem.'],c:'Os nervos cervicais controlam até o diafragma, o principal músculo da respiração.'},
 ganglios:{n:'Gânglios espinais',k:'SNP · Gânglio sensitivo',d:'São pequenos inchaços na raiz dorsal de cada nervo espinal. Ali estão os corpos dos neurônios sensitivos.',f:['Um gânglio é um grupo de corpos neuronais fora do sistema nervoso central.','A informação sensitiva passa por eles a caminho da medula.','Cada gânglio atende uma área da pele e dos órgãos.'],c:'O vírus da catapora pode ficar escondido nesses gânglios por anos.'},
 simpatica:{n:'Cadeia simpática',k:'SNP · Sistema autônomo',d:'São duas cadeias de gânglios ao lado da coluna. Formam o sistema simpático, que prepara o corpo para agir rápido ("luta ou fuga").',f:['Acelera o coração e a respiração.','Dilata as pupilas e freia a digestão.','Age sem você decidir: faz parte do sistema nervoso autônomo.'],c:'Quando você se assusta e o coração dispara, a cadeia simpática está trabalhando.'},
 intercostales:{n:'Nervos intercostais',k:'SNP · Torácicos',d:'Passam entre as costelas. Movem os músculos que ajudam a respirar e dão sensibilidade ao tórax e ao abdome.',f:['Saem dos nervos espinais torácicos.','Controlam os músculos intercostais que sobem e descem as costelas.','Levam o tato e a dor da parede do tórax.'],c:'O soluço ocorre por espasmos do diafragma, controlado por outro nervo: o frênico.'},
 braquial:{n:'Plexo braquial',k:'SNP · Rede de nervos',d:'É uma rede onde se misturam as raízes dos nervos espinais cervicais e do primeiro torácico. Dali nascem os nervos do braço.',f:['Forma-se com 5 raízes (C5 a T1).','Passa pelo ombro, entre o pescoço e a axila.','Uma lesão grave pode paralisar o braço.'],c:'Um puxão forte no ombro num acidente pode danificar o plexo braquial.'},
 radial:{n:'Nervo radial',k:'SNP · Misto',d:'Percorre o lado externo do braço até o dorso da mão. Estende o cotovelo, o punho e os dedos.',f:['Move o tríceps, o músculo de trás do braço.','Dá sensibilidade ao dorso da mão e ao lado do polegar.','Dormir com o braço pendurado numa cadeira pode comprimi-lo e adormecer a mão.'],c:'Se for lesado, o punho cai e fica difícil levantar a mão.'},
 mediano:{n:'Nervo mediano',k:'SNP · Misto',d:'Desce pelo meio do antebraço e passa pelo punho até a palma. Flexiona os dedos e permite pegar com precisão.',f:['Dá sensibilidade à palma, ao polegar e aos dedos indicador e médio.','Passa pelo túnel do carpo, um espaço estreito do punho.','Se comprimido, causa formigamento: síndrome do túnel do carpo.'],c:'Usar muito o teclado ou o celular sem descanso pode irritá-lo.'},
 cubital:{n:'Nervo ulnar',k:'SNP · Misto',d:'Percorre o lado interno do braço, passa atrás do cotovelo e chega aos dedos mínimo e anelar. Move os músculos pequenos da mão.',f:['Dá sensibilidade ao mínimo e à metade do anelar.','No cotovelo é muito superficial e quase sem proteção.','Permite abrir e fechar os dedos com força.'],c:'A batida no "osso da alegria" do cotovelo na verdade atinge esse nervo.'},
 lumbosacro:{n:'Plexo lombossacral',k:'SNP · Rede de nervos',d:'É uma rede de nervos na região da cintura e da pelve. Dela saem os nervos das pernas.',f:['Forma-se com raízes das vértebras lombares e sacrais.','Move o quadril, a coxa e a perna.','Dá sensibilidade à parte inferior do corpo.'],c:'É a maior rede nervosa do corpo.'},
 femoral:{n:'Nervo femoral',k:'SNP · Misto',d:'Desce pela frente da coxa. Estende o joelho e dá sensibilidade à face anterior e interna da perna.',f:['Move o quadríceps, o maior músculo da coxa.','Seu ramo final, o nervo safeno, chega ao tornozelo.','Participa do reflexo patelar.'],c:'No reflexo patelar, uma batidinha no joelho faz a perna pular sem você decidir.'},
 ciatico:{n:'Nervo ciático',k:'SNP · Misto',d:'É o nervo mais longo e grosso do corpo. Vai da pelve por trás da coxa e se divide em dois ramos acima do joelho: o tibial e o fibular.',f:['Sua espessura chega a ser como a de um dedo.','Controla os músculos de trás da coxa, da perna e do pé.','A ciática é a dor que aparece quando é comprimido.'],c:'Mede mais de um metro, quase o comprimento da perna.'},
 piel:{n:'Receptores da pele',k:'Receptores sensitivos',d:'São terminações nervosas que detectam tato, pressão, temperatura e dor. Transformam o estímulo em impulso nervoso.',f:['As pontas dos dedos têm muitíssimos, por isso são tão sensíveis.','Os receptores de dor (nociceptores) nos avisam do perigo.','A informação viaja por neurônios sensitivos até a medula e o encéfalo.'],c:'Algumas áreas da pele, como as costas, têm bem menos receptores que os lábios.'},
 musculo:{n:'Músculo (efetor)',k:'Efetor',d:'Os músculos são efetores: recebem as ordens dos neurônios motores e respondem contraindo-se.',f:['O neurônio motor se liga à fibra muscular na placa motora.','O neurotransmissor acetilcolina dá a ordem de contrair.','Os músculos esqueléticos se movem por vontade, exceto nos reflexos.'],c:'Um único neurônio motor pode controlar de poucas fibras até milhares.'},
 frontal:{n:'Lobo frontal',k:'SNC · Cérebro',d:'É a parte da frente e a maior do cérebro. Planeja, toma decisões, controla o movimento voluntário e a linguagem falada.',f:['O córtex motor, no fim do lobo, ordena os movimentos.','Participa da personalidade, da atenção e do autocontrole.','Só termina de amadurecer perto dos 25 anos.'],c:'É a região que mais muda durante a adolescência.'},
 parietal:{n:'Lobo parietal',k:'SNC · Cérebro',d:'Recebe e interpreta as sensações do corpo: tato, pressão, temperatura e dor. Também ajuda a se orientar no espaço.',f:['O córtex sensitivo fica logo atrás do córtex motor.','Cada parte do corpo tem sua zona; mãos e lábios ocupam muito espaço.','Permite saber onde está sua mão sem olhar.'],c:'Graças ao lobo parietal você digita sem olhar para o teclado.'},
 temporal:{n:'Lobo temporal',k:'SNC · Cérebro',d:'Fica nas laterais, perto das orelhas. Processa os sons, ajuda a compreender a linguagem e participa da memória.',f:['O córtex auditivo interpreta o que ouvimos.','Contém o hipocampo, essencial para formar lembranças novas.','Também participa do olfato e das emoções.'],c:'Uma canção pode trazer de volta uma lembrança inteira graças a essa área.'},
 occipital:{n:'Lobo occipital',k:'SNC · Cérebro',d:'Fica atrás da cabeça. É o centro da visão: recebe o que os olhos captam e monta a imagem.',f:['Recebe os impulsos do nervo óptico.','Reconhece formas, cores e movimento.','Se for lesado, pode-se perder a visão mesmo com olhos saudáveis.'],c:'Uma pancada forte na nuca às vezes faz "ver estrelas".'},
 cerebelo:{n:'Cerebelo',k:'SNC · Encéfalo',d:'Fica embaixo do cérebro, atrás. Coordena os movimentos, mantém o equilíbrio e deixa os gestos precisos e suaves.',f:['Seu nome significa "pequeno cérebro".','Tem mais da metade dos neurônios de todo o encéfalo.','Aprende movimentos automáticos, como andar de bicicleta.'],c:'Com o cerebelo lesado, tocar o nariz com o dedo fica difícil.'},
 tronco:{n:'Tronco encefálico',k:'SNC · Encéfalo',d:'Une o cérebro à medula espinal. É formado pelo mesencéfalo, a ponte e o bulbo.',f:['Controla funções vitais: respiração, batimentos e pressão.','Regula atos como engolir, tossir e vomitar.','Por ele passam quase todos os nervos que sobem e descem.'],c:'Você não decide respirar enquanto dorme: o bulbo faz isso por você.'},
 dendritas:{n:'Dendritos',k:'Neurônio · Recepção',d:'São prolongamentos curtos e muito ramificados. Recebem as mensagens de outros neurônios e as levam ao corpo celular.',f:['Sua forma de árvore aumenta a superfície para receber sinais.','Um neurônio pode receber milhares de contatos.','O nome vem do grego "dendron", árvore.'],c:'Aprender coisas novas cria mais ramificações e conexões.'},
 soma:{n:'Corpo celular (soma)',k:'Neurônio · Integração',d:'É a parte central do neurônio. Contém o núcleo e as organelas que fabricam o que a célula precisa e soma os sinais que chegam.',f:['Decide se um impulso nervoso é gerado.','Contém mitocôndrias que dão energia.','Mede entre 4 e 100 micrômetros.'],c:'Os corpos celulares formam a substância cinzenta.'},
 nucleo:{n:'Núcleo',k:'Neurônio · Controle',d:'Guarda o DNA e dirige as atividades da célula. Ali está a informação para fabricar as proteínas de que o neurônio precisa.',f:['Tem uma zona escura chamada nucléolo.','A maioria dos neurônios quase não se divide.','Por isso cuidar do cérebro é tão importante.'],c:'Cada neurônio do seu corpo tem o mesmo DNA, mas usa genes diferentes.'},
 axon:{n:'Axônio',k:'Neurônio · Condução',d:'É um prolongamento longo e fino que conduz o impulso elétrico do corpo celular até outras células.',f:['Cada neurônio tem um só axônio, que se ramifica no final.','Pode medir mais de um metro, como nos que vão da medula ao pé.','O impulso viaja em uma só direção.'],c:'Alguns axônios da girafa medem vários metros.'},
 mielina:{n:'Bainha de mielina',k:'Neurônio · Isolante',d:'É uma cobertura de gordura e proteínas que envolve o axônio por trechos. Isola o axônio e faz o impulso viajar muito mais rápido.',f:['As células de Schwann a formam nos nervos.','O impulso pode chegar a 120 m/s, uns 430 km/h.','Na esclerose múltipla a mielina é danificada.'],c:'A mielina é esbranquiçada: por isso a "substância branca" tem essa cor.'},
 ranvier:{n:'Nós de Ranvier',k:'Neurônio · Condução',d:'São os pequenos espaços sem mielina entre um trecho e outro. Neles o impulso se regenera e "salta" de nó em nó.',f:['Esse salto se chama condução saltatória.','Torna a transmissão mais rápida e gasta menos energia.','Ficam separados por 1 a 2 mm em axônios grandes.'],c:'Têm o nome do médico francês Louis Ranvier, que os descreveu.'},
 terminales:{n:'Botões terminais',k:'Neurônio · Transmissão',d:'São as extremidades do axônio. Ali o impulso elétrico vira um sinal químico liberado para outra célula.',f:['Contêm vesículas com neurotransmissores.','Podem se conectar a outro neurônio, um músculo ou uma glândula.','Cada neurônio pode ter centenas de terminais.'],c:'O contato entre um botão terminal e outra célula se chama sinapse.'},
 presin:{n:'Terminal pré-sináptico',k:'Sinapse · Neurônio emissor',d:'É a extremidade do axônio do neurônio que envia a mensagem. Quando o impulso chega, libera neurotransmissores.',f:['Contém mitocôndrias que fornecem energia.','O impulso abre canais e entra cálcio (Ca²⁺).','O cálcio faz as vesículas se fundirem com a membrana.'],c:'Sem cálcio, a sinapse não funciona.'},
 vesiculas:{n:'Vesículas sinápticas',k:'Sinapse · Armazém',d:'São bolsinhas minúsculas cheias de neurotransmissores. Esperam perto da membrana até o impulso chegar.',f:['Fundem-se com a membrana e esvaziam o conteúdo.','Esse processo se chama exocitose.','Depois a célula recicla suas membranas.'],c:'Um terminal pode ter centenas de vesículas prontas.'},
 neurotrans:{n:'Neurotransmissores',k:'Sinapse · Mensageiros',d:'São substâncias químicas que levam a mensagem de um neurônio ao seguinte. Cada tipo produz efeitos diferentes.',f:['Exemplos: acetilcolina, dopamina, serotonina e GABA.','São eliminados logo: recapturados ou destruídos.','Alguns remédios e drogas agem sobre eles.'],c:'A dopamina está relacionada à motivação e ao prazer.'},
 hendidura:{n:'Fenda sináptica',k:'Sinapse · Espaço',d:'É o espaço minúsculo entre dois neurônios. O impulso elétrico não consegue atravessá-lo, então passa como sinal químico.',f:['Mede uns 20 a 40 nanômetros.','Um nanômetro é a milionésima parte de um milímetro.','Os neurotransmissores a cruzam em milésimos de segundo.'],c:'É cerca de 2 000 vezes mais estreita que um fio de cabelo.'},
 receptores:{n:'Receptores',k:'Sinapse · Recepção',d:'São proteínas na membrana do neurônio receptor. Cada uma se encaixa em um neurotransmissor, como uma chave numa fechadura.',f:['Ao se ligar, abrem canais para a entrada de íons.','Só respondem ao neurotransmissor correspondente.','Seu número muda com o uso.'],c:'A cafeína bloqueia receptores e por isso tira o sono.'},

function smooth(pts){let d='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const a=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],b=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+='C'+a[0].toFixed(1)+','+a[1].toFixed(1)+' '+b[0].toFixed(1)+','+b[1].toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1)}

const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;

/* ---------- cámara SVG ---------- */
class Cam{
  constructor(svg,base){this.svg=svg;this.base=base;this.target=base;this.raf=0;this.cur=this.fit(base);this.apply(this.cur)}
  aspect(){const s=$('#stage');return Math.max(.3,s.clientWidth/Math.max(1,s.clientHeight))}
  fit(b){let [x,y,w,hh]=b;const a=this.aspect();if(w/hh<a){const nw=hh*a;x-=(nw-w)/2;w=nw}else{const nh=w/a;y-=(nh-hh)/2;hh=nh}return[x,y,w,hh]}
  apply(v){this.cur=v;this.svg.setAttribute('viewBox',v.map(n=>n.toFixed(2)).join(' '))}
  go(b,ms=850,instant){this.target=b;const to=this.fit(b);cancelAnimationFrame(this.raf);
    if(instant||REDUCED){this.apply(to);return}
    const from=this.cur.slice(),t0=performance.now();
    const step=now=>{const k=Math.min(1,(now-t0)/ms),e=ease(k);this.apply(from.map((v,i)=>v+(to[i]-v)*e));if(k<1)this.raf=requestAnimationFrame(step)};
    this.raf=requestAnimationFrame(step)}
  refit(){this.go(this.target,0,true)}
  home(){this.go(this.base)}
}
function boxOf(node,pad,minSize){const b=node.getBBox();let w=b.width+pad*2,hh=b.height+pad*2;
  const m=minSize||0;if(w<m)w=m;if(hh<m)hh=m;
  return[b.x+b.width/2-w/2,b.y+b.height/2-hh/2,w,hh]}

function renderPanel(){

  }else{
    const it=IT(st.sel);

    if(it.f&&it.f.length)html+='<ul>'+it.f.map(f=>`<li>${f}</li>`).join('')+'</ul>';
    if(it.c)html+=`<div class="curio"><b>${t.ui.fun}</b>${it.c}</div>`;
  }
  p.innerHTML=html;
  if(def.panelExtra){const x=def.panelExtra();if(x)p.appendChild(x)}
  const nav=h('div',{class:'pnav'});
  const idx=ids.indexOf(st.sel);
  if(ids.length&&!def.noNav){

    pv.onclick=()=>select(vk,ids[(idx<=0?ids.length:idx)-1]);

/* animador simple: llama fn(k) con k de 0 a 1 durante ms; se puede cancelar con un token */
function anim(ms,fn,tok){return new Promise(res=>{const t0=performance.now();
  (function f(now){if(tok&&tok.stop){res(false);return}const k=Math.min(1,(now-t0)/ms);fn(k);if(k<1)requestAnimationFrame(f);else res(true)})(t0)})}

  const ok=await anim(ms,k=>{const p=path.getPointAtLength(L*k);pul.setAttribute('transform',`translate(${p.x},${p.y})`)},tk);pul.setAttribute('opacity',0);return ok}
let tok=null;
function reset(){arm.style.transform='';mus.style.transform='';dolor.setAttribute('opacity',0)}
async function act(id){if(tok)tok.stop=true;const my=tok={stop:false};
  if(id!=='efector'&&id!=='cerebro')reset();
  const S_='var(--sens)',M_='var(--motor)';
  if(id==='estimulo'){await anim(1200,k=>fl.parentNode.style.filter=`drop-shadow(0 0 ${8+Math.sin(k*9)*6}px #f6b83a)`,my);ES.style.filter=''}
  else if(id==='receptor'){await run(SAp,S_,1)}
  else if(id==='sensitiva'){if(await run(SAp,S_,1000,my))await run(SBp,S_,1300,my)}
  else if(id==='interneurona'){await run(INp,S_,1100,my)}
  else if(id==='motora'){await run(MOp,M_,1500,my)}
  else if(id==='efector'){mus.style.transform='scale(.82,1.5)';arm.style.transform='rotate(26deg)'}
  else if(id==='cerebro'){if(await run(CEp,S_,1500,my)){dolor.setAttribute('opacity',1)}}}
def.onSelect=id=>{act(id)};
def.onClear=()=>{if(tok)tok.stop=true;reset();pul.setAttribute('opacity',0)};
let play=0;
def.tools=(add,t)=>{const b=add('▶ '+t.play,async b=>{if(play){play=0;return}play=1;b.setAttribute('aria-pressed',true);reset();
  const dur={estimulo:1500,receptor:1000,sensitiva:2500,interneurona:1700,motora:2100,efector:2000,cerebro:2600};
  for(const id of IDS){if(!play||view!=='reflex')break;select('reflex',id);await sleep(dur[id])}
  play=0;b.setAttribute('aria-pressed',false)},false)};
def.hide=()=>{play=0;if(tok)tok.stop=true;reset()};
})();

/* ---------- DESAFÍO ---------- */
let QZ={i:0,pick:null,res:[]};
function renderQuiz(){const q=$('#quiz'),t=T(),Q=t.quiz;q.innerHTML='';
  const done=QZ.i>=Q.length,add=(tag,txt,cls)=>{const e=h(tag,cls?{class:cls}:{},txt);q.appendChild(e);return e};
  add('h2',t.ui.quizT);
  const bar=h('div',{class:'qbar'});Q.forEach((_,i)=>{const s=h('span');if(QZ.res[i]===true)s.className='ok';else if(QZ.res[i]===false)s.className='no';else if(i===QZ.i)s.className='cur';bar.appendChild(s)});q.appendChild(bar);
  if(done){const n=QZ.res.filter(Boolean).length;
    add('div',t.ui.done,'pcap');add('div',n+' / '+Q.length,'qscore');
    add('p',t.ui.rank[n>=6?2:n>=4?1:0]);
    const b=h('button',{type:'button'},t.ui.again);b.onclick=()=>{QZ={i:0,pick:null,res:[]};renderQuiz()};q.appendChild(b);return}
  const it=Q[QZ.i];add('div',t.ui.qOf+' '+(QZ.i+1)+' / '+Q.length,'pcap');add('h3',it.q).style.cssText='font:600 21px/1.3 var(--f-head);margin:6px 0 4px';
  const box=h('div',{class:'qopts'});
  it.o.forEach((o,i)=>{const b=h('button',{type:'button'},o);
    if(QZ.pick!==null){b.disabled=true;b.style.cursor='default';if(i===it.a)b.className='ok';else if(i===QZ.pick)b.className='no'}
    b.onclick=()=>{if(QZ.pick!==null)return;QZ.pick=i;QZ.res[QZ.i]=(i===it.a);renderQuiz()};box.appendChild(b)});
  q.appendChild(box);
  if(QZ.pick!==null){const ok=QZ.pick===it.a;const e=h('div',{class:'qexp'});const b=h('b',{},ok?t.ui.ok:t.ui.no);b.style.display='block';e.append(b,it.e);q.appendChild(e);
    const nx=h('button',{type:'button'},QZ.i===Q.length-1?t.ui.finish:t.ui.nextQ);nx.onclick=()=>{QZ.i++;QZ.pick=null;renderQuiz()};q.appendChild(nx)}}
